# smithery.yaml
name: x402-finance
displayName: x402 Finance
description: >
  Live crypto market data on Base Mainnet via x402 V2 micropayments (USDC).
  Agents must handle HTTP 402 + PAYMENT-SIGNATURE. Token safety and holder
  cluster tools are listed as coming soon.
homepage: https://x402-paid-api.x402-finance.workers.dev
documentation: https://x402-paid-api.x402-finance.workers.dev/llms.txt

# MCP Server configuration
mcp:
  type: http
  url: https://x402-paid-api.x402-finance.workers.dev/mcp

# Protocol details
protocol: x402-v2
network: eip155:8453
asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
payTo: "0xE8bC82d53E45e61e07D84536970d695265A51CE4"

tools:
  - name: get_market_data
    description: Real-time BTC, ETH and SOL prices (LIVE)
    path: /api/paid-content
    method: GET
    status: live
    price:
      amount: "2000"
      usd: 0.002
      asset: USDC
  - name: check_token_safety
    description: Honeypot, tax, liquidity and ownership analysis (COMING SOON — do not rely on for production payments yet)
    path: /api/token-safety
    method: GET
    status: coming_soon
    price:
      amount: "40000"
      usd: 0.04
      asset: USDC
    parameters:
      - name: address
        type: string
        required: true
        description: Token contract address on Base (0x...)
  - name: analyze_holder_clusters
    description: Holder concentration and coordinated wallet cluster analysis (COMING SOON — do not rely on for production payments yet)
    path: /api/holder-clusters
    method: GET
    status: coming_soon
    price:
      amount: "10000"
      usd: 0.01
      asset: USDC
    parameters:
      - name: address
        type: string
        required: true
        description: Token contract address on Base (0x...)

notes: |
  Primary LIVE tool: get_market_data ($0.002 USDC).
  Payment flow:
  1. Call endpoint -> HTTP 402 + PAYMENT-REQUIRED
  2. Sign payment payload
  3. Retry with PAYMENT-SIGNATURE header
  See /llms.txt for full documentation.
